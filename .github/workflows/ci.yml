name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -e "apps/ingest-api[dev]"
          pip install -e "apps/device-simulator[dev]"

      - name: Lint
        run: |
          ruff check apps/ingest-api apps/device-simulator
          ruff format --check apps/ingest-api apps/device-simulator

      - name: Typecheck ingest-api
        working-directory: apps/ingest-api
        run: mypy src

      - name: Typecheck device-simulator
        working-directory: apps/device-simulator
        run: mypy src

      - name: Verify layering contracts
        working-directory: apps/ingest-api
        run: lint-imports

      - name: Test ingest-api
        working-directory: apps/ingest-api
        run: pytest

      - name: Test device-simulator
        working-directory: apps/device-simulator
        run: pytest

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    strategy:
      matrix:
        app: [ingest-api, device-simulator, dashboard]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: apps/${{ matrix.app }}
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
